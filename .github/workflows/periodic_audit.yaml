name: Periodic audit

# https://rustsec.org/

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1,3,5"
  push:
    branches:
      - "**"
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - "audit.toml"
      - ".github/workflows/periodic_audit.yaml"

jobs:
  audit_cargo_deps:
    name: "Audit Cargo Dependencies"
    runs-on: ubuntu-22.04-16core
    permissions:
      issues: write # `audit-check` ask for this right in documentation, but fails if the repository does not handle issues
      checks: write
      pull-requests: read
      contents: read
    env:
      MISE_ENV: dev
    steps:
      - uses: actions/checkout@v6
      # ----------------------------------------------------------------------------------
      # To run these tools on local machine :
      # ```sh
      # mise use -e local cargo:cargo-deny cargo:cargo-audit
      # cargo audit
      # cargo deny --all-features check all
      # ```

      - uses: rustsec/audit-check@v1.4.1
        name: Audit Rust Dependencies
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          mise use -e local cargo:cargo-deny
          cargo deny --all-features check all
